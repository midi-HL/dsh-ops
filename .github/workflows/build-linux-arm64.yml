name: Build linux-arm64 worker

# Local fork addition (not upstream). Builds the native Rust worker for
# aarch64-unknown-linux-gnu on an x64 GitHub runner, stages it under
# runtime/linux-arm64/ with its provenance receipt, and uploads it.
#
# Reproducibility: the toolchain version, runner image and every produced
# sha256 are printed into the run summary. Nothing is downloaded at install
# time and nothing is published from here.

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust toolchain version
        required: false
        default: '1.97.1'
  push:
    branches: [arm64-local]
    paths:
      - 'native/**'
      - 'src/**'
      - 'bin/native-runtime.mjs'
      - '.github/workflows/build-linux-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: linux-arm64 (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      TARGET_TRIPLE: aarch64-unknown-linux-gnu
      TARGET_NAME: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install aarch64 cross linker
        # Bounded and retried: a stuck apt mirror on a shared runner must fail the
        # step, not hang the job. The cross linker is the only native dependency.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            if sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 update -qq \
               && sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                 install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "apt failed after 3 attempts" >&2; exit 1; }
            sleep 10
          done
          aarch64-linux-gnu-gcc --version | head -1

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "${{ inputs.rust_version || '1.97.1' }}" --profile minimal
          rustup default "${{ inputs.rust_version || '1.97.1' }}"
          rustup target add "$TARGET_TRIPLE"
          rustc -Vv

      - name: Configure the cross linker
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Build the plugin JS (src -> lib)
        run: npm run build

      - name: Build the native worker
        run: cargo build --release --locked --manifest-path native/Cargo.toml --target "$TARGET_TRIPLE"

      - name: Verify the ELF architecture
        run: |
          file native/target/$TARGET_TRIPLE/release/dsh-ops-worker
          readelf -h native/target/$TARGET_TRIPLE/release/dsh-ops-worker | grep -E 'Class|Machine|Type'

      - name: Stage the runtime with its provenance receipt
        run: node bin/native-runtime.mjs stage --platform "$TARGET_NAME" --input "native/target/$TARGET_TRIPLE/release"

      - name: Check the staged runtime
        run: node bin/native-runtime.mjs check --platform "$TARGET_NAME"

      - name: Smoke-test the worker under qemu-user
        # Real calls through the versioned envelope against the aarch64 sysroot.
        # qemu-user is only a build-time sanity check that the aarch64 ELF runs;
        # the real acceptance test is on the PRoot aarch64 host.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y --no-install-recommends qemu-user-static
          SYSROOT=/usr/aarch64-linux-gnu
          ls "$SYSROOT/etc" | head
          cat > /tmp/stat.json <<'JSON'
          {"version":1,"requestId":"ci-stat","component":"file","budget":{"timeoutMs":30000,"maxBytes":131072},"request":{"root":"/etc","scope":"ci","tool":"stat","args":{"path":"/etc/os-release"},"read_only":true}}
          JSON
          cat > /tmp/glob.json <<'JSON'
          {"version":1,"requestId":"ci-glob","component":"file","budget":{"timeoutMs":30000,"maxBytes":131072},"request":{"root":"/etc","scope":"ci","tool":"glob","args":{"pattern":"/etc/*release*"},"read_only":true}}
          JSON
          echo '--- --version ---'
          qemu-aarch64-static -L "$SYSROOT" runtime/$TARGET_NAME/dsh-ops-worker --version
          echo '--- stat /etc/os-release ---'
          qemu-aarch64-static -L "$SYSROOT" runtime/$TARGET_NAME/dsh-ops-worker < /tmp/stat.json | head -c 2000
          echo
          echo '--- glob /etc/*release* ---'
          qemu-aarch64-static -L "$SYSROOT" runtime/$TARGET_NAME/dsh-ops-worker < /tmp/glob.json | head -c 2000
          echo

      - name: Record digests in the run summary
        shell: bash
        run: |
          {
            echo "## linux-arm64 worker"
            echo
            echo '```'
            echo "runner:   $ImageOS $ImageVersion"
            echo "rustc:    $(rustc -V)"
            echo "target:   $TARGET_TRIPLE"
            echo "size:     $(stat -c %s runtime/$TARGET_NAME/dsh-ops-worker) bytes"
            echo "sha256:   $(sha256sum runtime/$TARGET_NAME/dsh-ops-worker | cut -d' ' -f1)"
            echo
            cat runtime/$TARGET_NAME/provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: runtime/linux-arm64/
          if-no-files-found: error
          retention-days: 30
