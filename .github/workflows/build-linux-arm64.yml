name: Build linux-arm64 worker

# Local fork addition (not upstream). Builds the native Rust worker for
# aarch64-unknown-linux-gnu on an x64 GitHub runner, stages it under
# runtime/linux-arm64/ with its provenance receipt, and uploads it.
#
# No apt: the cross linker and glibc sysroot come from zig, installed as a
# self-contained wheel (`pip install ziglang`). Public runner apt mirrors have
# hung mid-download on this repository, which would otherwise make the build
# non-reproducible in the sense that matters — the same commit failing for
# reasons outside the code.
#
# Reproducibility: the toolchain versions, runner image and every produced
# sha256 are printed into the run summary. Nothing is downloaded at install
# time and nothing is published from here.

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust toolchain version
        required: false
        default: '1.97.1'
  push:
    branches: [arm64-local]
    paths:
      - 'native/**'
      - 'src/**'
      - 'bin/native-runtime.mjs'
      - '.github/workflows/build-linux-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: linux-arm64 (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      TARGET_TRIPLE: aarch64-unknown-linux-gnu
      TARGET_NAME: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "${{ inputs.rust_version || '1.97.1' }}" --profile minimal
          rustup default "${{ inputs.rust_version || '1.97.1' }}"
          rustup target add "$TARGET_TRIPLE"
          rustc -Vv

      - name: Install zig (self-contained glibc cross toolchain)
        # pip wheel, no apt. `zig cc` supplies the linker, crt objects and the
        # aarch64 glibc sysroot, which is exactly what cargo-zigbuild wires up.
        run: |
          python -m pip install --disable-pip-version-check 'ziglang==0.13.0' 'cargo-zigbuild==0.19.7'
          python -c "import ziglang,os;print('zig:',os.path.join(os.path.dirname(ziglang.__file__),'zig'))"
          python -m ziglang version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Build the plugin JS (src -> lib)
        run: npm run build

      - name: Build the native worker
        shell: bash
        run: |
          cargo zigbuild --release --locked \
            --manifest-path native/Cargo.toml \
            --target "$TARGET_TRIPLE"

      - name: Verify the ELF architecture
        run: |
          file native/target/$TARGET_TRIPLE/release/dsh-ops-worker
          readelf -h native/target/$TARGET_TRIPLE/release/dsh-ops-worker | grep -E 'Class|Machine|Type'

      - name: Stage the runtime with its provenance receipt
        run: node bin/native-runtime.mjs stage --platform "$TARGET_NAME" --input "native/target/$TARGET_TRIPLE/release"

      - name: Check the staged runtime
        run: node bin/native-runtime.mjs check --platform "$TARGET_NAME"

      - name: Smoke-test the worker under qemu-user (best effort)
        # A build-time sanity check only; the authoritative acceptance run is on
        # the PRoot aarch64 device. Non-fatal because installing qemu needs apt,
        # and a flaky apt mirror must not fail an otherwise good build.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -uo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y --no-install-recommends qemu-user-static || {
              echo "qemu unavailable; skipping (device run is authoritative)" >&2; exit 0; }
          SYSROOT=/usr/aarch64-linux-gnu
          cat > /tmp/stat.json <<'JSON'
          {"version":1,"requestId":"ci-stat","component":"file","budget":{"timeoutMs":30000,"maxBytes":131072},"request":{"root":"/etc","scope":"ci","tool":"stat","args":{"path":"/etc/os-release"},"read_only":true}}
          JSON
          echo '--- --version ---'
          qemu-aarch64-static -L "$SYSROOT" runtime/$TARGET_NAME/dsh-ops-worker --version
          echo '--- stat /etc/os-release ---'
          qemu-aarch64-static -L "$SYSROOT" runtime/$TARGET_NAME/dsh-ops-worker < /tmp/stat.json | head -c 2000
          echo

      - name: Record digests in the run summary
        shell: bash
        run: |
          {
            echo "## linux-arm64 worker"
            echo
            echo '```'
            echo "runner:   $ImageOS $ImageVersion"
            echo "rustc:    $(rustc -V)"
            echo "zig:      $(python -m ziglang version)"
            echo "target:   $TARGET_TRIPLE"
            echo "size:     $(stat -c %s runtime/$TARGET_NAME/dsh-ops-worker) bytes"
            echo "sha256:   $(sha256sum runtime/$TARGET_NAME/dsh-ops-worker | cut -d' ' -f1)"
            echo
            cat runtime/$TARGET_NAME/provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: runtime/linux-arm64/
          if-no-files-found: error
          retention-days: 30
