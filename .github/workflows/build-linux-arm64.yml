name: Build linux-arm64 worker

# Local fork addition (not upstream). Builds the native Rust worker for
# aarch64-unknown-linux-gnu on an x64 GitHub runner, stages it under
# runtime/linux-arm64/ with its provenance receipt, and uploads it.
#
# Reproducibility: the toolchain version, runner image and every produced
# sha256 are printed into the run summary. Nothing is downloaded at install
# time and nothing is published from here.

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust toolchain version
        required: false
        default: '1.97.1'
  push:
    branches: [arm64-local]
    paths:
      - 'native/**'
      - 'src/**'
      - 'bin/native-runtime.mjs'
      - '.github/workflows/build-linux-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: linux-arm64 (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      TARGET_TRIPLE: aarch64-unknown-linux-gnu
      TARGET_NAME: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install "${{ inputs.rust_version || '1.97.1' }}" --profile minimal
          rustup default "${{ inputs.rust_version || '1.97.1' }}"
          rustup target add "$TARGET_TRIPLE"
          rustc -Vv

      - name: Configure the cross linker
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Build the plugin JS (src -> lib)
        run: npm run build

      - name: Build the native worker
        run: cargo build --release --locked --manifest-path native/Cargo.toml --target "$TARGET_TRIPLE"

      - name: Verify the ELF architecture
        run: |
          file native/target/$TARGET_TRIPLE/release/dsh-ops-worker
          readelf -h native/target/$TARGET_TRIPLE/release/dsh-ops-worker | grep -E 'Class|Machine|Type'

      - name: Stage the runtime with its provenance receipt
        run: node bin/native-runtime.mjs stage --platform "$TARGET_NAME" --input "native/target/$TARGET_TRIPLE/release"

      - name: Check the staged runtime
        run: node bin/native-runtime.mjs check --platform "$TARGET_NAME"

      - name: Smoke-test the worker under qemu-user
        # One real `stat` call through the versioned envelope. qemu-user is only a
        # build-time sanity check that the aarch64 ELF runs; the real acceptance
        # test is on the PRoot aarch64 host.
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static
          printf '%s' '{"version":1,"requestId":"ci-smoke","component":"file","budget":{"timeoutMs":30000,"maxBytes":131072},"request":{"root":"/etc","scope":"ci","tool":"stat","args":{"path":"/etc/hostname"},"read_only":true}}' > /tmp/req.json
          echo '--- --version ---'
          qemu-aarch64-static -L /usr/aarch64-linux-gnu runtime/$TARGET_NAME/dsh-ops-worker --version
          echo '--- stat /etc/hostname ---'
          qemu-aarch64-static -L /usr/aarch64-linux-gnu runtime/$TARGET_NAME/dsh-ops-worker < /tmp/req.json | head -c 2000
          echo

      - name: Record digests in the run summary
        shell: bash
        run: |
          {
            echo "## linux-arm64 worker"
            echo
            echo '```'
            echo "runner:   $ImageOS $ImageVersion"
            echo "rustc:    $(rustc -V)"
            echo "target:   $TARGET_TRIPLE"
            echo "size:     $(stat -c %s runtime/$TARGET_NAME/dsh-ops-worker) bytes"
            echo "sha256:   $(sha256sum runtime/$TARGET_NAME/dsh-ops-worker | cut -d' ' -f1)"
            echo
            cat runtime/$TARGET_NAME/provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: runtime/linux-arm64/
          if-no-files-found: error
          retention-days: 30
